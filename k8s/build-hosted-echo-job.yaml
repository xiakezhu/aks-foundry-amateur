apiVersion: batch/v1
kind: Job
metadata:
  name: build-hosted-echo
  namespace: default
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: materialize
          image: mcr.microsoft.com/azure-cli:2.67.0
          command: ["bash", "-c", "cp -L /in/* /out/ && ls -la /out"]
          volumeMounts:
            - name: src
              mountPath: /in
            - name: ctx
              mountPath: /out
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --context=dir:///workspace
            - --dockerfile=Dockerfile
            - --destination=<acr-login-server>/hosted-echo:<tag>
            - --custom-platform=linux/amd64
          volumeMounts:
            - name: ctx
              mountPath: /workspace
            - name: docker-config
              mountPath: /kaniko/.docker
      volumes:
        - name: src
          configMap:
            name: hosted-echo-src
        - name: ctx
          emptyDir: {}
        - name: docker-config
          secret:
            secretName: acr-push
            items:
              - key: .dockerconfigjson
                path: config.json
